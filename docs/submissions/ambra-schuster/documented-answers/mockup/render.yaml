# Render blueprint for the Documented resource-assistant mockup.
#
# Two things are NOT in this repo and must be set in the Render dashboard:
#   1. ANTHROPIC_API_KEY  -> Environment > Environment Variables (secret)
#   2. corpus.json        -> Environment > Secret Files, filename `corpus.json`,
#                            mounted at /opt/render/project/src/<rootDir>/
# Both are gitignored on purpose. See mockup/DEPLOY.md.
services:
  - type: web
    name: documented-answers-mockup
    runtime: python
    plan: free
    rootDir: docs/submissions/ambra-schuster/documented-answers/mockup
    buildCommand: pip install -r requirements.txt
    startCommand: python serve.py
    healthCheckPath: /healthz
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # set by hand in the dashboard; never in git
      - key: MAX_PER_SESSION
        value: "15"
      - key: MAX_PER_DAY
        value: "150"
      - key: PYTHON_VERSION
        value: "3.11.9"
